name: Reproduce issue 2189

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - run: bun install --frozen-lockfile

      - name: Control — npm run
        run: npm run release

      - name: Reproduction — vp run
        run: bunx vp run release
